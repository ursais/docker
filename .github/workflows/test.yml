name: Test
on:
  pull_request:

env:
  APPS: "backup odoo postgresql pyspy"
  LINT_APPS: "postgresql pyspy"
  OS: "ubuntu"
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Lint Operating Systems"
        run: |
          OLD_PWD=$(pwd)
          for image in `find $OS -name Dockerfile | sort -r`; do
            echo "Linting $image..."
            cd $(dirname $image)
            docker build . --file Dockerfile --check
            cd $OLD_PWD
          done

      - name: "Operating Systems"
        run: |
          set -uo pipefail
          pids=()
          images=()
          for image in $(find $OS -name Dockerfile | sort -r); do
            echo "Starting build of $image..."
            DIR=$(dirname $image)
            IMAGE_ID=$(echo $DIR | sed -e 's/^\.\///g' -e 's/\//-/g')
            (
              cd "$DIR"
              docker build . --file Dockerfile --no-cache \
                --tag "${IMAGE_ID}:latest" \
                --tag "${{ env.REGISTRY }}/${{ env.ORG }}/${IMAGE_ID}:latest"
              echo "Build of $image completed!"
            ) &
            pids+=($!)
            images+=("$image")
          done
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::Build failed for ${images[$i]}"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: "Lint Applications"
        run: |
          OLD_PWD=$(pwd)
          for image in `find $LINT_APPS -name Dockerfile | sort -r`; do
            echo "Linting $image..."
            cd $(dirname $image)
            docker build . --file Dockerfile --check
            cd $OLD_PWD
          done

      - name: "Applications"
        run: |
          set -uo pipefail
          pids=()
          images=()
          for image in $(find $APPS -name Dockerfile | sort -r); do
            echo "Starting build of $image..."
            (
              cd "$(dirname $image)"
              docker build . --file Dockerfile --no-cache --progress=plain 2>&1
              echo "Build of $image completed!"
            ) &
            pids+=($!)
            images+=("$image")
          done
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::Build failed for ${images[$i]}"
              failed=1
            fi
          done
          ! docker image prune -f
          [ "$failed" -eq 0 ] || exit 1
