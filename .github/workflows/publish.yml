name: Publish
on:
  push:
    branches:
      - master
    tags:
      - '*'

env:
  APPS: "backup odoo postgresql pyspy"
  OS: "ubuntu"
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  DOCKER_BUILDKIT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Operating Systems"
        run: |
          OLD_PWD=$(pwd)
          for image in `find ${{ env.OS }} -name Dockerfile | sort -r`; do
            echo "Building $image..."
            DIR=$(dirname $image)
            IMAGE_ID=$(echo $DIR | sed -e 's/^\.\///g' -e 's/\//-/g')
            VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
            [ "$VERSION" == "master" ] && VERSION=latest
            docker buildx build $DIR \
              --file $image \
              --platform linux/amd64,linux/arm64 \
              --tag ${{ env.REGISTRY }}/${{ env.ORG }}/$IMAGE_ID:$VERSION \
              --push \
              --no-cache
            echo "Build of $image completed!"
            cd $OLD_PWD
          done

      - name: "Applications"
        run: |
          OLD_PWD=$(pwd)
          for image in `find ${{ env.APPS }} -name Dockerfile | sort -r`; do
            echo "Building $image..."
            DIR=$(dirname $image)
            IMAGE_ID=$(echo $DIR | sed -e 's/^\.\///g' -e 's/\//-/g')
            VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
            [ "$VERSION" == "master" ] && VERSION=latest
            docker buildx build $DIR \
              --file $image \
              --platform linux/amd64,linux/arm64 \
              --tag ${{ env.REGISTRY }}/${{ env.ORG }}/$IMAGE_ID:$VERSION \
              --push \
              --no-cache
            echo "Build of $image completed!"
            cd $OLD_PWD
          done
